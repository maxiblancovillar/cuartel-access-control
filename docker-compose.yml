services:
  postgres:
    image: postgres:16-alpine
    container_name: cuartel_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cuartel_user
      POSTGRES_PASSWORD: MiPassword123
      POSTGRES_DB: cuartel_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cuartel_user -d cuartel_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
